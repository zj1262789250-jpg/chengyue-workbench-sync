# Render Blueprint —— 诚悦新媒体运营工作台（前端 + 同步后端同端口）
# 用法：在 Render 新建 Blueprint，连接包含本文件的 GitHub 仓库即可一键部署。
services:
  - type: web
    name: chengyue-workbench-sync
    runtime: node
    plan: free                       # 免费版；如需持久化同步数据 + 不休眠，改为 starter($7/月) 并启用下方 disks
    region: oregon                   # 可选：singapore / frankfurt 等
    branch: main
    buildCommand: "npm install"      # 零依赖，实际不装任何包
    startCommand: "npm start"
    # Render 会自动注入 PORT 环境变量，server.js 已支持
    envVars:
      - key: NODE_ENV
        value: production
    # 持久磁盘仅付费计划(starter及以上)可用；免费版请保持注释状态。
    # 如需持久化同步数据，取消下方注释并升级到 starter 计划：
    # disks:
    #   - name: workbench-data
    #     mountPath: /data
    #     sizeGB: 1
