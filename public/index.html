  --p2:#1f5fd0; --p2-bg:#eff4ff;
  --p3:#667085; --p3-bg:#f4f5f7;
  --ok:#079455; --ok-bg:#ecfdf3;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 8px 24px rgba(16,24,40,.10);
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}

/* ---------- 顶栏 ---------- */
.topbar{
  background:var(--panel); border-bottom:1px solid var(--border);
  padding:14px 28px; display:flex; align-items:center; gap:16px;
  position:sticky; top:0; z-index:50;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{
  width:32px;height:32px;border-radius:8px;background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;letter-spacing:-.5px;overflow:hidden;
}
.logo-mark img{width:100%;height:100%;object-fit:cover;display:block}
.logo h1{font-size:16px;font-weight:650;letter-spacing:-.2px}
.logo p{font-size:12px;color:var(--text-3);margin-top:-2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.date-chip{font-size:12.5px;color:var(--text-2);background:var(--panel-2);border:1px solid var(--border);padding:6px 12px;border-radius:20px}
.date-chip.ok{color:#0a7d3c;background:#eaf7ef;border-color:#bfe6cd}
.date-chip.warn{color:#9a6b00;background:#fff7e6;border-color:#f3e0b0}
.btn{
  padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;
  border:1px solid var(--border); background:var(--panel); color:var(--text-2);
  transition:all .15s;
}
.btn:hover{background:var(--panel-2);border-color:#d0d7e2;color:var(--text)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-dark);color:#fff;border-color:var(--accent-dark)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn-danger:hover{color:var(--p0);border-color:#f7c9c5;background:var(--p0-bg)}

/* ---------- 概览 ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:22px 28px 60px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
.stat{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 16px;box-shadow:var(--shadow);
}
.stat-label{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:5px}
.stat-num{font-size:26px;font-weight:680;letter-spacing:-1px;line-height:1.25;margin-top:3px}
.stat-sub{font-size:11.5px;color:var(--text-3)}
.stat.alert .stat-num{color:var(--p0)}
.stat.warn .stat-num{color:var(--p1)}
.stat.good .stat-num{color:var(--ok)}

/* ---------- Tab ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tab{
  padding:10px 16px;font-size:14px;color:var(--text-2);font-weight:500;
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .15s;
}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .badge{
  display:inline-block;background:var(--p0);color:#fff;font-size:10.5px;font-weight:600;
  padding:0 6px;border-radius:9px;margin-left:5px;vertical-align:1px;
}
.view{display:none}
.view.on{display:block}

/* ---------- 工具条 ---------- */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .spacer{margin-left:auto}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{padding:5px 12px;font-size:13px;border-radius:6px;color:var(--text-2)}
.seg button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
select.filter,input.search{
  padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
  color:var(--text-2);font-size:13px;outline:none;
}
select.filter:focus,input.search:focus{border-color:var(--accent)}
input.search{width:210px}

/* ---------- 看板 ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.col{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r);padding:12px;min-height:200px}
.col.drag-over{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
.col-head{display:flex;align-items:center;gap:7px;margin-bottom:11px;padding:0 2px}
.col-dot{width:7px;height:7px;border-radius:50%}
.col-title{font-size:13px;font-weight:650;color:var(--text)}
.col-count{font-size:12px;color:var(--text-3);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:0 7px}
.col-add{margin-left:auto;color:var(--text-3);font-size:17px;line-height:1;padding:2px 5px;border-radius:5px}
.col-add:hover{background:var(--panel);color:var(--accent)}

.card{
  background:var(--panel);border:1px solid var(--border);border-radius:9px;
  padding:11px 12px;margin-bottom:9px;box-shadow:var(--shadow);cursor:grab;transition:all .15s;
}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);border-color:#d3dae4}
.card.dragging{opacity:.4}
.card-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px}
.card-title{font-size:13.5px;font-weight:560;line-height:1.45;flex:1;word-break:break-word}
.card-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pill{font-size:11px;font-weight:550;padding:2px 7px;border-radius:5px;white-space:nowrap}
.pill-p0{background:var(--p0-bg);color:var(--p0)}
.pill-p1{background:var(--p1-bg);color:var(--p1)}
.pill-p2{background:var(--p2-bg);color:var(--p2)}
.pill-p3{background:var(--p3-bg);color:var(--p3)}
.pill-type{background:var(--panel-2);color:var(--text-2);border:1px solid var(--border-2)}
.pill-due{background:var(--panel-2);color:var(--text-2);border:1px solid var(--border-2)}
.pill-due.overdue{background:var(--p0-bg);color:var(--p0);border-color:#fbd5d1;font-weight:600}
.pill-due.today{background:var(--p1-bg);color:var(--p1);border-color:#fde68a;font-weight:600}
.pill-owner{background:var(--accent-soft);color:var(--accent)}
.card-note{font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.5;border-top:1px dashed var(--border-2);padding-top:6px}
.card-acts{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.card:hover .card-acts{opacity:1}
.icon-btn{width:22px;height:22px;border-radius:5px;color:var(--text-3);font-size:13px;display:flex;align-items:center;justify-content:center;line-height:1}
.icon-btn:hover{background:var(--panel-2);color:var(--accent)}
.icon-btn.del:hover{background:var(--p0-bg);color:var(--p0)}

/* ---------- 四象限 ---------- */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.quad{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px;min-height:190px}
.quad.drag-over{border-color:var(--accent);border-style:dashed;background:var(--accent-soft)}
.quad-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border-2)}
.quad-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.quad-name{font-size:13.5px;font-weight:650}
.quad-tip{font-size:11.5px;color:var(--text-3);margin-left:auto}

/* ---------- 流水线 ---------- */
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;align-items:start}
.pipeline .col{padding:10px}
.pipeline .card-title{font-size:13px}

/* ---------- 卡片网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.tile{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow);transition:all .15s;position:relative;
}
.tile:hover{box-shadow:var(--shadow-lg);border-color:#d3dae4}
.tile-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}
.tile-title{font-size:14.5px;font-weight:620;line-height:1.45;flex:1}
.tile-sub{font-size:12px;color:var(--text-3);margin-bottom:10px}
.tile-body{font-size:12.8px;color:var(--text-2);line-height:1.62}
.tile-angle{
  background:var(--accent-soft);border-left:3px solid var(--accent);
  padding:9px 11px;border-radius:0 7px 7px 0;font-size:12.5px;color:var(--accent-dark);
  margin-top:10px;line-height:1.6;
}
.tile-learn{
  background:var(--ok-bg);border-left:3px solid var(--ok);
  padding:9px 11px;border-radius:0 7px 7px 0;font-size:12.5px;color:#05603a;
  margin-top:10px;line-height:1.6;
}
.tile-recent{
  background:var(--p1-bg);border-left:3px solid var(--p1);
  padding:9px 11px;border-radius:0 7px 7px 0;font-size:12.5px;color:#8a4b06;
  margin-top:10px;line-height:1.6;
}
.tile-foot{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:11px;border-top:1px solid var(--border-2);flex-wrap:wrap}
.tile-acts{margin-left:auto;display:flex;gap:5px}
.heat{color:var(--p1);font-size:12px;letter-spacing:1px}

/* ---------- 今日推荐 ---------- */
.today-rec{background:linear-gradient(135deg,#eaf1ff,#f6f9ff);border:1px solid #d6e2fb;border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.rec-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rec-flag{background:var(--accent);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.rec-date{font-size:12px;color:var(--text-3)}
.rec-title{font-size:17px;font-weight:650;line-height:1.4;margin-bottom:4px}
.rec-author{font-size:13px;color:var(--text-2);margin-bottom:10px}
.rec-why{font-size:13px;color:var(--text-1);line-height:1.65;background:rgba(255,255,255,.62);padding:10px 12px;border-radius:8px;margin-bottom:8px}
.rec-tip{font-size:13px;color:#164aa8;line-height:1.65;background:rgba(255,255,255,.62);padding:10px 12px;border-radius:8px}
.rec-acts{display:flex;gap:8px;margin-top:12px}
.rec-empty{font-size:13px;color:var(--text-3);padding:14px}

/* ---------- 空态 ---------- */
.empty{
  text-align:center;padding:52px 20px;color:var(--text-3);
  background:var(--panel);border:1px dashed var(--border);border-radius:var(--r);
}
.empty-icon{font-size:30px;opacity:.35;margin-bottom:8px}
.empty p{font-size:13px}
.col .empty{padding:22px 10px;background:transparent;border:none;font-size:12px}

/* ---------- 弹窗 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:100;
  display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px);
}
.mask.on{display:flex}
.modal{
  background:var(--panel);border-radius:14px;width:100%;max-width:540px;
  max-height:88vh;overflow-y:auto;box-shadow:0 24px 64px rgba(16,24,40,.24);
}
.modal-head{padding:18px 22px 14px;border-bottom:1px solid var(--border-2);display:flex;align-items:center}
.modal-head h3{font-size:16px;font-weight:650}
.modal-close{margin-left:auto;color:var(--text-3);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.modal-close:hover{background:var(--panel-2);color:var(--text)}
.modal-body{padding:18px 22px}
.modal-foot{padding:14px 22px 18px;display:flex;gap:9px;justify-content:flex-end}
.confirm-card{
  background:var(--panel);border-radius:14px;width:100%;max-width:380px;
  padding:22px 22px 18px;box-shadow:0 24px 64px rgba(16,24,40,.24);
  animation:pop .14s ease-out;
}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:scale(1);opacity:1}}
.confirm-msg{font-size:14.5px;line-height:1.6;color:var(--text);padding:2px 2px 18px;white-space:pre-line}
.confirm-foot{padding:2px 0 0;display:flex;gap:9px;justify-content:flex-end}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;
  background:var(--panel);outline:none;transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{resize:vertical;min-height:72px;line-height:1.6}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:11.5px;color:var(--text-3);margin-top:5px}

.section-title{font-size:14px;font-weight:650;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:2px}

.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#171b22;color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;
  z-index:200;opacity:0;transition:all .25s;box-shadow:var(--shadow-lg);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:1280px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .kanban{grid-template-columns:repeat(2,1fr)}
  .pipeline{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:760px){
  .wrap{padding:16px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .kanban,.pipeline,.matrix{grid-template-columns:1fr}
  .topbar{padding:12px 16px;flex-wrap:wrap}
}

/* ==========================================================
   AI 技巧库 / 剪映教程 通用样式
   ========================================================== */
.ai-hero{
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(135deg, #f5f3ff 0%, #fff 60%);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px 22px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}
.ai-hero-title{font-size:16px;font-weight:700;color:var(--text);letter-spacing:.2px;margin-bottom:4px}
.ai-hero-sub{font-size:13px;color:var(--text-2)}
.ai-hero-stat{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#fff;border:1px solid var(--border);border-radius:50%;
  width:64px;height:64px;font-weight:700;font-size:20px;color:#7a5af8;flex-shrink:0;
}
.ai-hero-stat-sub{font-size:10px;color:var(--text-3);font-weight:500;margin-top:2px}

.tips-feed{display:flex;flex-direction:column;gap:14px}
.tip-card-wrap{position:relative}
.tip-card{
  display:flex;gap:14px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:14px;text-decoration:none;color:inherit;
  transition:all .2s ease;
  box-shadow:var(--shadow);
}
.tip-card:hover{border-color:var(--accent);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.tip-card-wrap:hover .tip-del{opacity:1;visibility:visible}
.tip-del{
  position:absolute;top:8px;right:8px;z-index:3;
  width:26px;height:26px;border-radius:50%;border:1px solid var(--border);
  background:var(--panel);color:#98a2b3;font-size:13px;line-height:1;cursor:pointer;
  opacity:0;visibility:hidden;transition:all .15s ease;
  display:flex;align-items:center;justify-content:center;
}
.tip-del:hover{background:#fef3f2;color:#d92d20;border-color:#fda29b}
.tip-src{
  position:absolute;bottom:6px;right:6px;
  font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;letter-spacing:.2px;
}
.src-auto{background:rgba(16,185,129,.15);color:#067647;backdrop-filter:blur(2px)}
.src-manual{background:rgba(124,58,237,.15);color:#7a5af8;backdrop-filter:blur(2px)}
.src-seed{background:rgba(31,95,208,.12);color:#1f5fd0;backdrop-filter:blur(2px)}
.src-weread{background:rgba(250,173,20,.16);color:#b54708;backdrop-filter:blur(2px)}
.tile-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tile-head .tip-src{margin-top:2px;flex-shrink:0}
.rec-note{font-size:12px;color:var(--text-3);background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin:0 0 12px}
.tip-thumb{
  position:relative;flex-shrink:0;width:140px;height:90px;
  background:linear-gradient(135deg,#1f2937,#374151);border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;
  overflow:hidden;
}
.tip-thumb-fallback{text-align:center;line-height:1.3;padding:6px}
.tip-badge{
  position:absolute;top:6px;left:6px;
  background:#d92d20;color:#fff;font-size:10px;font-weight:600;
  padding:2px 8px;border-radius:10px;letter-spacing:.3px;
}
.tip-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tip-title{font-size:15px;font-weight:650;color:var(--text);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tip-meta{font-size:12px;color:var(--text-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tip-meta .dot{color:var(--text-3);opacity:.6}
.tip-summary{font-size:13px;color:var(--text-2);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tip-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tip-tags .tag{
  font-size:11px;padding:2px 8px;border-radius:10px;
  background:#f4f5f7;color:#5a6474;letter-spacing:.2px;
}
.tip-tags .tag-level{background:#ecf2fe;color:#1f5fd0}
.tip-takeaway{
  margin-top:4px;font-size:12.5px;color:#2c5c44;line-height:1.5;
  background:var(--ok-bg);border-left:3px solid var(--ok);
  padding:6px 10px;border-radius:0 6px 6px 0;
}

/* ==========================================================
   移动端布局（≤768px）— 参考图：左竖栏 + 顶页头 + 卡片流
   ========================================================== */
.m-sidebar,.m-page-header{display:none}
@media (max-width:768px){
  /* 桌面顶栏简化 */
  .topbar{padding:8px 12px;gap:8px;flex-wrap:nowrap}
  .logo h1{font-size:15px}
  .logo p{display:none}
  .logo-mark{width:28px;height:28px;font-size:13px}
  .topbar .btn{display:none}
  .date-chip{display:none}
  .topbar-actions{display:flex;gap:4px}
  .topbar-actions .btn{display:inline-flex;padding:5px 9px;font-size:12px}

  /* 隐藏桌面 stats + 顶部 tabs */
  .stats,.tabs{display:none}

  /* 左侧竖栏 */
  .m-sidebar{
    display:flex;flex-direction:column;align-items:stretch;gap:2px;
    position:fixed;top:0;left:0;bottom:0;width:60px;z-index:50;
    background:var(--panel);border-right:1px solid var(--border);
    padding:12px 6px;overflow-y:auto;overflow-x:hidden;
  }
  .m-sidebar::-webkit-scrollbar{display:none}
  .m-side-avatar{
    width:40px;height:40px;border-radius:50%;overflow:hidden;
    margin:0 auto 8px;flex-shrink:0;
    border:1.5px solid var(--border);
    box-shadow:0 1px 4px rgba(0,0,0,.06);
  }
  .m-side-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .m-side-item{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 2px;border-radius:8px;cursor:pointer;
    color:var(--text-3);font-size:10px;line-height:1.2;text-align:center;
    transition:all .15s;
    border:1px solid transparent;
  }
  .m-side-item:hover{background:var(--panel-2);color:var(--text-2)}
  .m-side-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .m-side-item .ico{font-size:18px;line-height:1}
  .m-side-item .lbl{
    font-size:10px;letter-spacing:0;word-break:keep-all;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

<script>
/* ==========================================================
   常量定义
   ========================================================== */
const TASK_TYPES = ['项目设计支持','PPT 排版','临时需求','视频拍摄','视频剪辑','活动物料','其他'];
const PRIOS = [
  {k:'P0', name:'紧急且重要', tip:'马上做', cls:'pill-p0'},
  {k:'P1', name:'重要不紧急', tip:'排期做', cls:'pill-p1'},
  {k:'P2', name:'紧急不重要', tip:'快速处理/转交', cls:'pill-p2'},
  {k:'P3', name:'不紧急不重要', tip:'有空再说', cls:'pill-p3'}
];
const TASK_COLS = [
  {k:'todo',  name:'待办',   color:'#98a2b3'},
  {k:'doing', name:'进行中', color:'#1f5fd0'},
  {k:'review',name:'待确认', color:'#dc6803'},
  {k:'done',  name:'已完成', color:'#079455'}
];
const VIDEO_STAGES = [
  {k:'idea',     name:'选题确认', color:'#98a2b3'},
  {k:'script',   name:'脚本撰写', color:'#7a5af8'},
  {k:'shoot',    name:'拍摄',     color:'#1f5fd0'},
  {k:'edit',     name:'剪辑',     color:'#0ba5ec'},
  {k:'review',   name:'审核',     color:'#dc6803'},
  {k:'published',name:'已发布',   color:'#079455'}
];
const PLATFORMS = ['视频号','抖音','小红书','公众号','视频号+抖音'];
const TOPIC_STATUS = {pending:'待评估', adopted:'已采用', dropped:'已搁置'};

const SEED_TOPIC_COLS = ['楼宇探访','选址干货','政策解读','客户故事','服务日常','园区生活','节点营销','团队 IP','行业观察'];

/* 数据源降级兜底 */
const SRC_BENCH  = (typeof window.WB_BENCHMARKS  !== 'undefined') ? window.WB_BENCHMARKS : [];
const SRC_HOT    = (typeof window.WB_HOTSPOTS    !== 'undefined') ? window.WB_HOTSPOTS : {updated:'—', items:[]};
const SRC_SEEDS  = (typeof window.WB_TOPIC_SEEDS !== 'undefined') ? window.WB_TOPIC_SEEDS : [];
const SRC_AI     = (typeof window.WB_AI_TIPS     !== 'undefined') ? window.WB_AI_TIPS : {updated:'—', items:[]};
const SRC_JY     = (typeof window.WB_JY_TIPS     !== 'undefined') ? window.WB_JY_TIPS : {updated:'—', items:[]};

const KEY = 'wb_brand_workbench_v1';

/* ==========================================================
   状态
   ========================================================== */
let state = load();
let boardView = 'kanban';
let currentTab = 'board';

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      s.tasks = s.tasks||[]; s.videos = s.videos||[]; s.topics = s.topics||[];
      s.hotLocal = s.hotLocal||[]; s.hotHidden = s.hotHidden||[];
      s.bench = (Array.isArray(s.bench)&&s.bench.length) ? s.bench : JSON.parse(JSON.stringify(SRC_BENCH)); // 空库自动从 SRC_BENCH 重新填充
      s.reading = s.reading||[];
      s.seen = s.seen||[];
      s.aiTips = s.aiTips||{ userAdded:[], userRemoved:[] };
      s.aiTips.userAdded = s.aiTips.userAdded||[];
      s.aiTips.userRemoved = s.aiTips.userRemoved||[];
      s.jyTips = s.jyTips||{ userAdded:[], userRemoved:[] };
      s.jyTips.userAdded = s.jyTips.userAdded||[];
      s.jyTips.userRemoved = s.jyTips.userRemoved||[];
      return s;
    }
  }catch(e){ console.warn('读取本地数据失败', e); }
  return seedState();
}

function seedState(){
  const t = today();
  return {
    tasks:[
      {id:uid(), title:'Q3 招商推介会 PPT 排版', type:'PPT 排版', prio:'P0', owner:'我', due:t, note:'甲方要求今天下班前出初稿，40 页', status:'doing', created:t},
      {id:uid(), title:'楼宇导视系统改造 · 效果图支持', type:'项目设计支持', prio:'P1', owner:'我', due:addDays(t,5), note:'配合工程部，需要 3 版方案', status:'todo', created:t},
      {id:uid(), title:'领导临时要的租户答谢会海报', type:'临时需求', prio:'P2', owner:'同事', due:addDays(t,1), note:'', status:'todo', created:t},
      {id:uid(), title:'8 月视频号内容排期表', type:'其他', prio:'P1', owner:'我', due:addDays(t,2), note:'定 4 条选题 + 拍摄档期', status:'todo', created:t}
    ],
    videos:[
      {id:uid(), title:'3 分钟看完整栋楼：从大堂到工位', stage:'script', platform:'视频号', owner:'我', pubDate:addDays(t,7), ref:'红姐去哪儿', note:'一镜到底，需要协调物业开顶层', created:t},
      {id:uid(), title:'租写字楼必问的 8 个问题', stage:'idea', platform:'视频号+抖音', owner:'同事', pubDate:addDays(t,12), ref:'商办老毕', note:'清单体，口播为主', created:t}
    ],
    topics:[],
    hotLocal:[], hotHidden:[],
    bench: JSON.parse(JSON.stringify(SRC_BENCH)),
    reading: [],
    seen:[],
    aiTips: { userAdded:[], userRemoved:[] },
    jyTips: { userAdded:[], userRemoved:[] }
  };
}
let storageWarned = false;
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
  }catch(e){
    // 极少数情况：浏览器禁用了本地存储 / 隐私模式 / 存储已满。
    // 这里必须吞掉异常，否则会中断后面的界面刷新。
    console.warn('本地存储写入失败：', e);
    if(!storageWarned){
      storageWarned = true;
      setTimeout(()=>{
        alert('提示：当前浏览器无法保存数据到本地（可能是隐私模式或存储被禁用）。\n\n你仍然可以正常使用，但关闭页面后改动会丢失。\n建议用右上角「导出备份」把数据存成文件。');
      }, 300);
    }
  }
}

/* ==========================================================
   工具
   ========================================================== */
function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }
function today(){ const d=new Date(); return fmt(d); }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ const d=new Date(s); d.setDate(d.getDate()+n); return fmt(d); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2000);
}
function prioOf(k){ return PRIOS.find(p=>p.k===k)||PRIOS[3]; }
function dueClass(due,status){
  if(!due||status==='done'||status==='published') return '';
  if(due<today()) return 'overdue';
  if(due===today()) return 'today';
  return '';
}
function dueText(due,status){
  if(!due) return '';
  const c=dueClass(due,status);
  if(c==='overdue'){
    const diff=Math.round((new Date(today())-new Date(due))/86400000);
    return '逾期 '+diff+' 天';
  }
  if(c==='today') return '今天到期';
  return due.slice(5);
}
function weekStart(){
  const d=new Date(); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return fmt(d);
}
function monthStart(){ const d=new Date(); return fmt(new Date(d.getFullYear(),d.getMonth(),1)); }

/* ==========================================================
   Tab
   ========================================================== */
const TABS = [
  {k:'board',   name:'任务看板'},
  {k:'video',   name:'视频流水线'},
  {k:'topics',  name:'选题库'},
  {k:'hotspots',name:'热点雷达'},
  {k:'bench',   name:'对标账号'},
  {k:'reading', name:'阅读计划'},
  {k:'aitips',  name:'AI 技巧库', icon:'✨'},
  {k:'jytips',  name:'剪映教程', icon:'✂️'},
];
function renderTabs(){
  const newHot = allHotspots().filter(h=>!state.seen.includes(h.id)).length;
  document.getElementById('tabs').innerHTML = TABS.map(t=>{
    const b = (t.k==='hotspots' && newHot>0) ? '<span class="badge">'+newHot+'</span>' : '';
    return '<button class="tab'+(currentTab===t.k?' on':'')+'" onclick="switchTab(\''+t.k+'\')">'+t.name+b+'</button>';
  }).join('');
}
function switchTab(k){
  currentTab=k;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('view-'+k).classList.add('on');
  if(k==='hotspots'){
    allHotspots().forEach(h=>{ if(!state.seen.includes(h.id)) state.seen.push(h.id); });
    save();
  }
  renderTabs();
  renderMobileSidebar(); renderMobilePageHeader();
}

/* ==========================================================
   概览
   ========================================================== */
function renderStats(){
  const t=today();
  const open = state.tasks.filter(x=>x.status!=='done');
  const todayCnt = open.filter(x=>x.due===t).length;
  const overdue  = open.filter(x=>x.due&&x.due<t).length;
  const doing    = state.tasks.filter(x=>x.status==='doing').length;
  const p0       = open.filter(x=>x.prio==='P0').length;
  const inProd   = state.videos.filter(v=>v.stage!=='published').length;
  const pubMonth = state.videos.filter(v=>v.stage==='published' && (v.pubDate||'') >= monthStart()).length;

  const cards=[
    {label:'今日到期', num:todayCnt, sub:'条任务', cls:todayCnt>0?'warn':''},
    {label:'已逾期',   num:overdue,  sub:'需要立刻处理', cls:overdue>0?'alert':''},
    {label:'P0 待处理',num:p0,       sub:'紧急且重要', cls:p0>0?'alert':''},

/* ==========================================================
   拖拽
   ========================================================== */
let dragItem=null;
function bindDrag(){
  document.querySelectorAll('.card[draggable]').forEach(c=>{
    c.ondragstart=e=>{
      // 在按钮 / 输入框上按下时，不要发起拖拽，否则点击会被浏览器吃掉（删除、编辑按钮点不动）
      if(e.target.closest('button, a, input, textarea, select')){ e.preventDefault(); return; }
      dragItem={id:c.dataset.id,kind:c.dataset.kind}; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move';
    };
    c.ondragend=()=>{ c.classList.remove('dragging'); dragItem=null; };
  });
  document.querySelectorAll('[data-drop]').forEach(z=>{
    z.ondragover=e=>{ e.preventDefault(); z.classList.add('drag-over'); };
    z.ondragleave=()=>z.classList.remove('drag-over');
    z.ondrop=e=>{
      e.preventDefault(); z.classList.remove('drag-over');
      if(!dragItem) return;
      const field=z.dataset.drop, val=z.dataset.val;
      if(dragItem.kind==='task'){
        const t=state.tasks.find(x=>x.id===dragItem.id); if(!t) return;
        if(field==='status'){ t.status=val; if(val==='done') t.doneAt=today(); else delete t.doneAt; }
        if(field==='prio') t.prio=val;
        save(); renderBoard();
      }else if(dragItem.kind==='video'){
        const v=state.videos.find(x=>x.id===dragItem.id); if(!v) return;
        if(field==='stage'){ v.stage=val; if(val==='published'&&!v.pubDate) v.pubDate=today(); }
        save(); renderVideos();
      }
    };
  });
}

/* 自绘确认框：不依赖浏览器原生 confirm（部分内嵌预览环境会禁用原生弹窗）。
   用法： if(await askConfirm('提示',{danger:true,okText:'删除'})) {...}  */
function askConfirm(msg, opts){
  opts = opts || {};
  return new Promise(res=>{
    const box=document.getElementById('confirmBox');
    document.getElementById('confirmMsg').textContent=msg;
    const okBtn=box.querySelector('[data-ok]');
    okBtn.textContent=opts.okText||'确定';
    okBtn.className='btn '+(opts.danger?'btn-danger':'btn-primary');
    box.classList.add('on');
    const done=v=>{
      box.classList.remove('on');
      okBtn.onclick=null; cancelBtn.onclick=null;
      document.removeEventListener('keydown', onKey);
      res(v);
    };
    const cancelBtn=box.querySelector('[data-cancel]');
    okBtn.onclick=()=>done(true);
    cancelBtn.onclick=()=>done(false);
    const onKey=e=>{ if(e.key==='Escape') done(false); };
    document.addEventListener('keydown', onKey);
  });
}
function closeConfirm(v){ const box=document.getElementById('confirmBox'); if(box.classList.contains('on')){ box.classList.remove('on'); document.getElementById('confirmBox').querySelector('[data-ok]').onclick=null; document.getElementById('confirmBox').querySelector('[data-cancel]').onclick=null; } }

/* ==========================================================
   阅读计划
   ========================================================== */
const READING_GOAL = { logic:'逻辑思维', express:'表达能力', both:'两者兼顾' };
const READING_STATUS = { want:'想读', reading:'在读', done:'已读' };
const READING_LIB_SEED = (typeof window.WB_READING_LIB !== 'undefined') ? window.WB_READING_LIB : [];
const READING_WEREAD  = (typeof window.WB_READING_WEREAD !== 'undefined' && window.WB_READING_WEREAD.items) ? window.WB_READING_WEREAD.items : [];
const READING_LIB = READING_LIB_SEED.concat(READING_WEREAD.map(b=>(Object.assign({source:'weread'}, b))));
const READING_TODAY = (typeof window.WB_READING_TODAY !== 'undefined') ? window.WB_READING_TODAY : null;
let _todayAvoid = [];

/* 微信阅读跳转：有精确链接用精确链接，否则按书名自动生成搜索链接 */
function wereadLink(obj){
  if(obj && obj.weread) return obj.weread;
  const kw = (obj && obj.title) ? obj.title : '';
  return 'https://weread.qq.com/web/search/books?keyword=' + encodeURIComponent(kw);
}

/* 来源标签：精选 / 微信读书 / 手动添加 */
function srcPill(src){
  if(src==='weread') return ' <span class="tip-src src-weread">📚 微信读书</span>';
  if(src==='manual') return ' <span class="tip-src src-manual">✋ 手动</span>';
  if(src==='seed')   return ' <span class="tip-src src-seed">📌 精选</span>';
  if(src==='auto')   return ' <span class="tip-src src-auto">🤖 自动抓</span>';
  return '';
}

function filteredReading(){
  const col=document.getElementById('filterReadGoal').value;
  const st=document.getElementById('filterReadStatus').value;
  const q=document.getElementById('searchRead').value.trim().toLowerCase();
  return state.reading.filter(r=>{
    if(col && r.goal!==col) return false;
    if(st && r.status!==st) return false;
    if(q && !((r.title+' '+(r.author||'')+' '+(r.note||'')).toLowerCase().includes(q))) return false;
    return true;
  });
}
function renderReading(){
  const list=filteredReading();
  const box=document.getElementById('readingGrid');
  if(!list.length){
    box.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📚</div><p>阅读计划还是空的。点右上角「加入书单」添加想读的书，或看顶部「今日推荐」直接加入。</p></div>';
    return;
  }
  box.innerHTML=list.map(r=>
    '<div class="tile">'+
      '<div class="tile-head"><div class="tile-title">'+esc(r.title)+'</div>'+(r.source?srcPill(r.source):'')+'</div>'+
      '<div class="tile-sub">'+
        '<span class="pill pill-owner">'+esc(r.author||'佚名')+'</span> '+
        '<span class="pill pill-type">'+(READING_GOAL[r.goal]||'未分类')+'</span> '+
        '<span class="pill '+(r.status==='done'?'pill-p2':r.status==='reading'?'pill-p1':'pill-p3')+'">'+READING_STATUS[r.status]+'</span>'+
      '</div>'+
      (r.note?'<div class="tile-body" style="margin-top:6px">'+esc(r.note)+'</div>':'')+
      '<div class="tile-foot">'+
        '<a class="btn btn-sm" href="'+esc(wereadLink(r))+'" target="_blank" rel="noopener" style="text-decoration:none" title="在微信读书中查看这本书">微信阅读</a>'+
        '<div class="tile-acts">'+
          '<button class="btn btn-sm" onclick="openReadingForm(\''+r.id+'\')">编辑</button>'+
          '<button class="btn btn-sm btn-danger" onclick="delReading(\''+r.id+'\')">删除</button>'+
        '</div>'+
      '</div>'+
    '</div>'
  ).join('');
}

function pickLibBook(avoid){
  if(!READING_LIB.length) return null;
  const pool=READING_LIB.filter(x=>!avoid.includes(x.id));
  const src=pool.length?pool:READING_LIB;
  return src[Math.floor(Math.random()*src.length)];
}
function addTodayToPlan(){
  const t=READING_TODAY; if(!t||!t.book){ toast('暂无可加入的推荐'); return; }
  const b=t.book;
  if(state.reading.some(x=>x.title===b.title)){ toast('这本书已在书单里'); return; }
  state.reading.push({id:uid(), title:b.title, author:b.author, goal:b.goal, weread:b.weread, status:'want', startDate:today(), note:'', created:today()});
  save(); renderReading(); toast('已加入书单（想读）');
}
function changeTodayBook(){
  const picked=pickLibBook(_todayAvoid); if(!picked){ toast('书库为空'); return; }
  _todayAvoid.push(picked.id);
  const box=document.getElementById('todayRec'); const goalTxt=READING_GOAL[picked.goal]||'';
  box.innerHTML=
    '<div class="rec-head"><span class="rec-flag">为你推荐</span><span class="rec-date">手动挑选</span></div>'+
    '<div class="rec-body">'+
      '<div class="rec-title">《'+esc(picked.title)+'》</div>'+
      '<div class="rec-author">'+esc(picked.author||'')+' · <span class="pill pill-type">'+goalTxt+'</span>'+srcPill(picked.source||'seed')+'</div>'+
      '<div class="rec-why"><b>为什么推荐</b>：'+esc(picked.why||'')+'</div>'+

function importData(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async ()=>{
    try{
      const s=JSON.parse(r.result);
      if(!s.tasks) throw new Error('格式不对');
      if(!await askConfirm('导入会覆盖当前所有数据，确定继续？',{okText:'覆盖导入',danger:true})) return;
      state=s; save(); renderAll(); toast('导入成功');
    }catch(err){ alert('导入失败：'+err.message); }
  };
  r.readAsText(f); e.target.value='';
}

}

function delTip(kind, id){
  const key = kind==='ai' ? 'aiTips' : 'jyTips';
  if(!id) return;
  if(!window.askConfirm){
    state[key].userRemoved.push(id); save();
    if(kind==='ai') renderAITips(); else renderJYTips();
    renderTabs(); toast('已删除'); return;
  }
  askConfirm('确定删除这条？删除后无法恢复。',{danger:true}).then(ok=>{
    if(!ok) return;
    if(!state[key].userRemoved.includes(id)) state[key].userRemoved.push(id);
    save();
    if(kind==='ai') renderAITips(); else renderJYTips();
    renderTabs(); toast('已删除');
  });
}

<!-- ===== 实时同步引擎（by 大头 2026-08-04） ===== -->
<script>
(function(){
  if(typeof state==='undefined'||typeof save==='undefined'||typeof renderAll==='undefined'){return;}
  const SYNC={enabled:true,pollMs:3000,lastModified:0,online:null,timer:null};
  const apiBase=location.origin+'/api';
  function setDot(st){const el=document.getElementById('syncDot');if(!el)return;el.className='sync-dot '+(st==='on'?'on':st==='off'?'off':'wait');el.title=st==='on'?'实时同步：已连接，数据多端实时共享':st==='off'?'实时同步：离线（仅本地保存）':'实时同步：连接中…';}
  function normalizeState(s){s=s||{};s.tasks=s.tasks||[];s.videos=s.videos||[];s.topics=s.topics||[];s.hotLocal=s.hotLocal||[];s.hotHidden=s.hotHidden||[];s.bench=(Array.isArray(s.bench)&&s.bench.length)?s.bench:JSON.parse(JSON.stringify(SRC_BENCH));s.reading=s.reading||[];s.seen=s.seen||[];return s;}
  async function pull(since){try{const r=await fetch(apiBase+'/state'+(since?('?since='+since):''),{cache:'no-store'});if(!r.ok)return null;return await r.json();}catch(e){return null;}}
  let inflight=false;
  async function push(){try{const r=await fetch(apiBase+'/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:state,lastModified:Date.now()})});if(r.ok){const d=await r.json();SYNC.lastModified=d.lastModified||Date.now();setDot('on');return true;}}catch(e){}setDot('off');return false;}
  let pushTimer=null;
  function pushDebounced(){clearTimeout(pushTimer);pushTimer=setTimeout(()=>{if(inflight){pushDebounced();return;}inflight=true;push().finally(()=>{inflight=false;});},400);}
  async function tick(){if(SYNC.timer===null)return;if(document.querySelector('.mask.on'))return;const r=await pull(SYNC.lastModified);if(!r){setDot('off');return;}if(r.unchanged){setDot('on');return;}if(r.state&&typeof r.state==='object'&&(r.lastModified||0)>SYNC.lastModified){SYNC.lastModified=r.lastModified;state=normalizeState(r.state);setDot('on');renderAll();}}
  async function initSync(){if(!SYNC.enabled)return;const r=await pull(0);if(r&&!r.unchanged&&r.state&&typeof r.state==='object'){SYNC.lastModified=r.lastModified||0;state=normalizeState(r.state);setDot('on');renderAll();}else if(r&&r.unchanged){SYNC.lastModified=r.lastModified||0;setDot('on');}else{setDot('off');push();}SYNC.timer=setInterval(tick,SYNC.pollMs);}
  const _origSave=save;
  save=function(){_origSave();if(SYNC.enabled)pushDebounced();};
  setDot('wait');
  initSync();
})();
</script>
